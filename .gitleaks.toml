title = "backup-system gitleaks config"

[extend]
useDefault = true

# テスト用フィクスチャ(使い捨ての鍵など)は誤検知として除外する。
# 実際の秘密がここに置かれていないことは、各リポジトリ側の責任とする。
[allowlist]
description = "test fixtures"
paths = [
  '''(^|/)testdata/''',
  '''(^|/)tests?/fixtures?/''',
  '''\.env\.example$''',
]

# WebSocketハンドシェイクのSec-WebSocket-Keyは公開仕様上の値(RFC 6455)で秘密ではない。
[[allowlists]]
description = "Sec-WebSocket-Key header"
regexTarget = "line"
regexes = ['''(?i)sec-websocket-key''']
