title = "backup-system gitleaks config"

[extend]
useDefault = true

# テスト用フィクスチャ(使い捨ての鍵など)は誤検知として除外する。
# 実際の秘密がここに置かれていないことは、各リポジトリ側の責任とする。
[[allowlists]]
description = "test fixtures"
paths = [
  '''(^|/)testdata/''',
  '''(^|/)tests?/fixtures?/''',
  '''\.env\.example$''',
]

# WebSocketハンドシェイクのSec-WebSocket-Keyは公開仕様上の値(RFC 6455)で秘密ではない。
[[allowlists]]
description = "Sec-WebSocket-Key header"
regexTarget = "line"
regexes = ['''(?i)sec-websocket-key''']

# 第三者のテストデータ・サンプル、および単体テスト内のダミー値(ファイル単位、ユーザー確認済み 2026-11-08)
[[allowlists]]
description = "third-party test vectors / samples and unit-test fixtures"
paths = [
  '''(^|/)tests/wycheproof/''',
  '''(^|/)vendor/webrtc-dtls/''',
  '''(^|/)site-packages/gdata\.py''',
  '''(^|/)zwitschern/pownce_utils\.py$''',
  '''(^|/)README\.transifex$''',
  '''(^|/)app/src-tauri/src/presence\.rs$''',
  '''(^|/)src/confirm_ui\.rs$''',
]
